const BIO_OK=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext&&window.crypto&&crypto.subtle);

const bz=a=>btoa(String.fromCharCode.apply(null,new Uint8Array(a))),bu=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)),bzu=a=>bz(a).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const bioDer=d=>{let o=2,r=[];for(let k=0;k<2;k++){let n=d[o+1],v=d.slice(o+2,o+2+n);o+=2+n;while(v.length>32&&v[0]==0)v=v.slice(1);const x=new Uint8Array(32);x.set(v,32-v.length);r.push(x)}const w=new Uint8Array(64);w.set(r[0]);w.set(r[1],32);return w};
async function bioEnroll(){

const pk=cr.response.getPublicKey&&cr.response.getPublicKey();
if(!pk)return toast('This browser cannot save the fingerprint key',3200);
S('lp10_bio',{id:bz(cr.rawId),pk:bz(pk)});toast('Fingerprint saved ✓ 👆',2600);route()}
catch(e){toast(e&&e.name=='NotAllowedError'?'Cancelled':'Fingerprint setup failed',2600)}}
async function bioLogin(){
const d=bioGet();if(!d)return;
const lk=J('lp10_lock',{n:0,u:0});if(Date.now()<lk.u)return toast('Too many tries — wait 5 min');
try{const ch=crypto.getRandomValues(new Uint8Array(32));
const as=await navigator.credentials.get({publicKey:{challenge:ch,rpId:location.hostname,allowCredentials:[{type:'public-key',id:bu(d.id),transports:['internal']}],userVerification:'required',timeout:6e4}});
const r=as.response,cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON)),ad=new Uint8Array(r.authenticatorData);
if(cd.type!=='webauthn.get'||cd.challenge!==bzu(ch)||cd.origin!==location.origin||!(ad[32]&4))throw 0;
const h=new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON)),m=new Uint8Array(ad.length+32);m.set(ad);m.set(h,ad.length);
const k=await crypto.subtle.importKey('spki',bu(d.pk),{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,bioDer(new Uint8Array(r.signature)),m))throw 0;
S('lp10_lock',{n:0,u:0});authOK=1;try{sessionStorage.setItem('lp10_auth',OWNER_H)}catch{}toast('Welcome, owner 👑',2200);location.hash='#/owner';route()}
catch(e){toast(e&&e.name=='NotAllowedError'?'Cancelled':'Fingerprint failed — use email & passcode',3000)}}
