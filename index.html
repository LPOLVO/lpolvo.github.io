<!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شحال بقا للوطني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }

      body {
        font-family: 'Cairo','Segoe UI',sans-serif;
        direction: rtl;
        min-height: 100vh;
        background: linear-gradient(160deg, #0a0000 0%, #1a0000 40%, #0d0000 70%, #000000 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
        position: relative;
        overflow-x: hidden;
      }

      /* Grid background */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(200,0,0,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(200,0,0,0.07) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      /* Scan line */
      .scanline {
        position: fixed;
        top: -4px;
        left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, #ff0000, transparent);
        animation: scanline 3s linear infinite;
        z-index: 1;
      }

      .container {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: relative;
        z-index: 2;
      }

      .glass {
        background: rgba(20,0,0,0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(200,0,0,0.4);
        border-radius: 16px;
        box-shadow: 0 4px 30px rgba(255,0,0,0.15);
      }

      /* Header */
      .header { text-align: center; }

      .warning-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(200,0,0,0.25);
        border: 2px solid #cc0000;
        border-radius: 8px;
        padding: 6px 20px;
        margin-bottom: 12px;
        animation: warningBlink 1s ease-in-out infinite;
      }
      .warning-badge span {
        color: #ff3333;
        font-weight: 900;
        font-size: 13px;
        letter-spacing: 3px;
      }
