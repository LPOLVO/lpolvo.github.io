/* ---- p4 Code rain ---- */
#ld .ldi-p4{background:#07030f;--pc:#a679ff;--hc:#d4baff;--k1:#a679ff;--k2:#5b2fd0;--b1:#3a1f80;--b2:#a679ff}

#ld .ldi-p5{background:radial-gradient(ellipse at 50% 35%,#3a1b78 0,#160a36 55%,#07031a 100%);--pc:#d6a8ff;--hc:#d9c3ff;--k1:#c58bff;--k2:#6f8cff;--b1:#6f8cff;--b2:#d6a8ff}
